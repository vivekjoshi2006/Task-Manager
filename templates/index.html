<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Keep-Style Notes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Google Fonts for 'Roboto' and 'Product Sans' -->

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@700&display=swap" rel="stylesheet">
</head>
<body class="glass-bg"> 
    <div class="container glass-card"> 
        <header class="app-header">

            <!-- New class for full heading color -->
             
            <h1 class="colorful-heading">My <span>Keep</span>-Style Notes</h1>
        </header>

        <section class="add-note-section">
            <div class="add-task-box">
                <input type="text" id="new-task-input" placeholder="Take a note..." autocomplete="off">
                <button id="add-task-btn" aria-label="Add new note">Add Note</button>
            </div>
        </section>

        <section id="tasks-container" class="notes-grid">
            <p class="no-tasks-message">Loading notes...</p>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
